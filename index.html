<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    color:white;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:3rem;
    color:#38bdf8;
}

header p{
    color:#cbd5e1;
    margin-top:10px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card,.weather-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.card h2,.weather-card h2{
    margin-bottom:15px;
    color:#67e8f9;
}

input,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:12px;
    background:#e2e8f0;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(45deg,#06b6d4,#3b82f6);
    color:white;
    font-weight:bold;
}

.task-section{
    margin-top:30px;
}

#taskList{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.task-card{
    background:white;
    color:black;
    padding:20px;
    border-radius:15px;
    border-left:6px solid #3b82f6;
}

.task-card h3{
    margin-bottom:10px;
}

.task-card p{
    margin-bottom:10px;
}

.btn-group{
    display:flex;
    gap:10px;
}

.edit-btn{
    background:#10b981;
}

.delete-btn{
    background:#ef4444;
}

.weather-card{
    margin-top:30px;
}

.weather-box{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
}

.date{
    color:#64748b;
    font-size:12px;
}

#weatherResult{
    margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<header>
<h1>🚀 TaskFlow Pro</h1>
<p>Organize. Prioritize. Achieve.</p>
</header>

<div class="dashboard">

<div class="card">
<h2>Add New Task</h2>

<form id="taskForm">

<input
type="text"
id="taskName"
placeholder="Task Name"
required>

<textarea
id="taskDescription"
placeholder="Task Description"
required>
</textarea>

<button type="submit">
Add Task
</button>

</form>
</div>

<div class="card">
<h2>Search Tasks</h2>

<input
type="text"
id="searchInput"
placeholder="Search Task">

</div>

</div>

<div class="task-section">
<h2>Your Tasks</h2>
<div id="taskList"></div>
</div>

<div class="weather-card">
<h2>🌤 Weather Finder</h2>

<input
type="text"
id="cityInput"
placeholder="Enter City Name">

<button onclick="getWeather()">
Get Weather
</button>

<div id="weatherResult"></div>
</div>

</div>

<script>

const taskForm=document.getElementById("taskForm");
const taskName=document.getElementById("taskName");
const taskDescription=document.getElementById("taskDescription");
const taskList=document.getElementById("taskList");
const searchInput=document.getElementById("searchInput");

let tasks=JSON.parse(localStorage.getItem("tasks")) || [];
let editTaskId=null;

function renderTasks(taskArray=tasks){

taskList.innerHTML=taskArray.map(task=>`

<div class="task-card">

<h3>${task.name}</h3>

<p>${task.description}</p>


<div class="btn-group">

<button
class="edit-btn"
onclick="editTask(${task.id})">
Edit
</button>

<button
class="delete-btn"
onclick="deleteTask(${task.id})">
Delete
</button>

</div>

</div>

`).join("");

}

taskForm.onsubmit=function(e){

e.preventDefault();

const name=taskName.value.trim();
const description=taskDescription.value.trim();

if(editTaskId){

tasks=tasks.map(task=>{

if(task.id===editTaskId){

return{
...task,
name,
description
};

}

return task;

});

editTaskId=null;

document.querySelector(
"#taskForm button"
).textContent="Add Task";

}
else{

tasks.push({
id:Date.now(),
name,
description,
createdAt:new Date().toLocaleString()
});

}

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

renderTasks();

taskForm.reset();

};

function editTask(id){

const task=tasks.find(
task=>task.id===id
);

taskName.value=task.name;
taskDescription.value=task.description;

editTaskId=id;

document.querySelector(
"#taskForm button"
).textContent="Update Task";

}

function deleteTask(id){

tasks=tasks.filter(
task=>task.id!==id
);

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

renderTasks();

}

searchInput.addEventListener("input",()=>{

const keyword=
searchInput.value.toLowerCase();

const filteredTasks=
tasks.filter(task=>
task.name.toLowerCase()
.includes(keyword)
);

renderTasks(filteredTasks);

});

async function getWeather(){

const city=
document.getElementById("cityInput").value;

const result=
document.getElementById("weatherResult");

try{

const response=await fetch(
`https://wttr.in/${city}?format=j1`
);

const data=await response.json();

result.innerHTML=`
<div class="weather-box">
<h3>${city}</h3>
<p>🌡 Temperature:
${data.current_condition[0].temp_C} °C</p>
<p>☁ Condition:
${data.current_condition[0].weatherDesc[0].value}</p>
<p>💧 Humidity:
${data.current_condition[0].humidity}%</p>
</div>
`;

}
catch{

result.innerHTML=
"<p>Unable to fetch weather.</p>";

}

}

renderTasks();

</script>

</body>
</html>
